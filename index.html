<!DOCTYPE html>

<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>超商取件資料</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #f3f4f2;
    margin: 0;
    padding: 30px 15px;
    color: #333;
}

.container {
    max-width: 650px;
    margin: auto;
}

/* 標題 */

header {
    text-align: center;
    margin-bottom: 35px;
}

h1 {
    font-size: 28px;
    margin-bottom: 10px;
}

header p {
    color: #666;
    line-height: 1.7;
}

/* 每個步驟 */

.step {
    background: white;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.step-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 18px;
}

.step-number {
    display: inline-block;
    background: #333;
    color: white;
    width: 30px;
    height: 30px;
    text-align: center;
    line-height: 30px;
    border-radius: 50%;
    margin-right: 8px;
}

/* 超商按鈕 */

.store-links {
    display: grid;
    gap: 12px;
}

.store-links a {
    display: block;
    text-align: center;
    padding: 16px;
    border-radius: 10px;
    text-decoration: none;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

.family {
    background: #008c95;
}

.seven {
    background: #d94b3d;
}

.store-links a:hover {
    opacity: 0.85;
}

/* 表單 */

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
}

/* 提醒 */

.notice {
    background: #fff7df;
    padding: 14px;
    border-radius: 8px;
    margin-top: 15px;
    line-height: 1.7;
    font-size: 15px;
}

/* 複製按鈕 */

.copy-button {
    width: 100%;
    border: none;
    padding: 16px;
    margin-top: 20px;
    background: #333;
    color: white;
    font-size: 17px;
    border-radius: 10px;
    cursor: pointer;
}

.copy-button:hover {
    opacity: 0.85;
}

</style>

</head>

<body>

<div class="container">

<header>

<h1>超商取件資料</h1>

<p>
請依照以下步驟查詢您方便取件的門市，<br>
並將資料整理後回傳給我。
</p>

</header>

<!-- STEP 1 -->

<div class="step">

<div class="step-title">
<span class="step-number">1</span>
查詢門市
</div>

<p>請選擇您方便取件的超商：</p>

<div class="store-links">

<a class="family"
href="https://www.family.com.tw/Marketing/zh/Map"
target="_blank">

全家便利商店<br>
查詢門市與店號

</a>

<a class="seven"
href="https://emap.pcsc.com.tw/ecmap/default.aspx"
target="_blank">

7-ELEVEN<br>
查詢門市與店號

</a>

</div>

</div>

<!-- STEP 2 -->

<div class="step">

<div class="step-title">
<span class="step-number">2</span>
記下店號
</div>

<p>
查詢到方便取件的門市後，請記下：
</p>

<div class="notice">

🏪 超商名稱<br>
📍 門市名稱<br>
🔢 <strong>門市店號</strong>

<br><br>

請特別確認您有找到「店號」，不要只提供門市名稱喔！

</div>

</div>

<!-- STEP 3 -->

<div class="step">

<div class="step-title">
<span class="step-number">3</span>
填寫並回傳資料
</div>

<label>收件人姓名</label> <input type="text" id="name" placeholder="請輸入收件人姓名">

<label>聯絡電話</label> <input type="tel" id="phone" placeholder="請輸入聯絡電話">

<label>超商</label>

<select id="store">

<option value="">請選擇超商</option>
<option value="全家便利商店">全家便利商店</option>
<option value="7-ELEVEN">7-ELEVEN</option>

</select>

<label>門市名稱</label> <input type="text" id="storeName" placeholder="例如：○○門市">

<label>門市店號</label> <input type="text" id="storeNumber" placeholder="請輸入門市店號">

<button class="copy-button" onclick="copyInfo()">

複製資料，回傳給我

</button>

</div>

</div>

<script>

function copyInfo() {

    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const store = document.getElementById("store").value;
    const storeName = document.getElementById("storeName").value;
    const storeNumber = document.getElementById("storeNumber").value;

    const text =

`收件人姓名：${name}

聯絡電話：${phone}

超商：${store}

門市名稱：${storeName}

門市店號：${storeNumber}`;


    navigator.clipboard.writeText(text);

    alert("資料已複製！請回到訊息中貼上並傳送給我。");

}

</script>

</body>
</html>
